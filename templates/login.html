<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trading Journal — Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root { --bg-primary: #0f1729; --bg-card: #162036; --bg-input: #0f1729; --border-color: #1e3054; --accent: #e94560; --green: #00c853; --text-primary: #e8eaf6; --text-muted: #7986cb; }
    body { background: var(--bg-primary); color: var(--text-primary); font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 16px; padding: 2.5rem; width: 100%; max-width: 400px; }
    .login-card h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.3rem; }
    .login-card .subtitle { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.5rem; }
    .form-control { background: var(--bg-input); border: 1px solid var(--border-color); color: var(--text-primary); }
    .form-control:focus { background: var(--bg-input); border-color: var(--accent); color: var(--text-primary); box-shadow: 0 0 0 0.2rem rgba(233,69,96,0.2); }
    .form-control::placeholder { color: var(--text-muted); opacity: 0.6; }
    .form-label { font-size: 0.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .btn-primary { background: var(--green); border-color: var(--green); color: #000; font-weight: 600; }
    .btn-primary:hover { background: #00b848; border-color: #00b848; color: #000; }
    .alert { font-size: 0.85rem; }
    .toggle-link { color: var(--accent); cursor: pointer; font-size: 0.85rem; }
    .toggle-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="text-center mb-3">
      <span style="font-size: 2.5rem;">📊</span>
    </div>
    <h2 class="text-center">Trading Journal</h2>
    <p class="subtitle text-center" id="formSubtitle">Sign in to continue</p>

    <div id="alertBox" class="alert alert-danger" style="display:none;"></div>

    <form id="authForm" onsubmit="handleAuth(event)">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" placeholder="your username" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="btn btn-primary w-100 mb-3" id="authBtn">Sign In</button>
    </form>

    <div class="text-center">
      <span id="toggleText">First time? </span>
      <span class="toggle-link" id="toggleLink" onclick="toggleMode()">Create account</span>
    </div>
  </div>

  <script>
    let isRegister = false;

    // Check if setup is needed (no users yet)
    fetch('/auth/status').then(r => r.json()).then(s => {
      if (s.authenticated) { window.location.href = '/'; return; }
      if (s.needsSetup) { setRegisterMode(); }
    });

    function setRegisterMode() {
      isRegister = true;
      document.getElementById('formSubtitle').textContent = 'Create your account';
      document.getElementById('authBtn').textContent = 'Create Account';
      document.getElementById('toggleText').textContent = 'Already have an account? ';
      document.getElementById('toggleLink').textContent = 'Sign in';
    }

    function toggleMode() {
      isRegister = !isRegister;
      if (isRegister) {
        setRegisterMode();
      } else {
        document.getElementById('formSubtitle').textContent = 'Sign in to continue';
        document.getElementById('authBtn').textContent = 'Sign In';
        document.getElementById('toggleText').textContent = 'First time? ';
        document.getElementById('toggleLink').textContent = 'Create account';
      }
      hideAlert();
    }

    async function handleAuth(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const btn = document.getElementById('authBtn');

      btn.disabled = true;
      hideAlert();

      try {
        const url = isRegister ? '/auth/register' : '/auth/login';
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();

        if (!res.ok) {
          showAlert(data.error);
          return;
        }

        window.location.href = '/';
      } catch (err) {
        showAlert('Connection error');
      } finally {
        btn.disabled = false;
      }
    }

    function showAlert(msg) {
      const el = document.getElementById('alertBox');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideAlert() {
      document.getElementById('alertBox').style.display = 'none';
    }
  </script>
</body>
</html>
